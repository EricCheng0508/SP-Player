name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows release
    # windows-2025 (windows-latest) ships VS 18 / MSVC 14.52, which turned the
    # deprecated /await coroutine feature into a hard error — and
    # flutter_inappwebview_windows still uses it (STL1011). Pin the VS 2022
    # image, which matches the toolchain the project builds with locally.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      # MSBuild overflows MAX_PATH (260) in the default D:\a\... workspace —
      # plugin .tlog paths alone reach ~270 chars (MSB3491). Mirror the repo
      # to C:\e\<repo> and export the short path as BUILD_WS there; all later
      # steps (pub get, codegen, build, packaging) run in the short path.
      # BUILD_WS (not GITHUB_WORKSPACE): the runner re-injects the reserved
      # GITHUB_WORKSPACE default into every step's process env, silently
      # reverting any GITHUB_ENV override — a non-reserved name survives.
      - name: Short workspace path (Windows MAX_PATH)
        shell: pwsh
        run: .github/scripts/use_short_windows_workdir.ps1

      - name: Enable long paths
        run: git config --global core.longpaths true

      # flutter_secure_storage_windows compiles <atlstr.h>, which ships only
      # with the "C++ ATL for latest v143 build tools" VS component — not
      # guaranteed present on hosted images. Idempotent self-heal before
      # every build (same step as build_windows.yml).
      - name: Ensure VS C++ ATL
        shell: pwsh
        run: .github/scripts/ensure_vs_cpp_atl.ps1

      - name: Flutter pub get
        working-directory: ${{ env.BUILD_WS }}
        run: flutter pub get

      - name: Codegen (drift / build_runner)
        working-directory: ${{ env.BUILD_WS }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        working-directory: ${{ env.BUILD_WS }}
        shell: pwsh
        run: |
          flutter build windows --release *>&1 | Tee-Object -FilePath flutter_build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the tail as error annotations so the failure is
            # readable via the checks API without authentication.
            Get-Content flutter_build.log -Tail 80 | ForEach-Object {
              if ($_.Trim()) { "::error::$_" }
            }
            exit $code
          }

      - name: Read version
        id: version
        working-directory: ${{ env.BUILD_WS }}
        shell: pwsh
        run: |
          $m = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          "version=$($m.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Portable zip: the whole Release directory (self-contained runtime),
      # excluding the heavy local-components directory (users install those
      # in-app or fetch them separately).
      - name: Package portable zip
        working-directory: ${{ env.BUILD_WS }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $src = Join-Path $env:BUILD_WS "build/windows/x64/runner/Release"
          $stage = Join-Path $env:BUILD_WS "build/portable/SP Player"
          $out = Join-Path $env:BUILD_WS "build/SP-Player-$v-portable-win64.zip"
          if (-not (Test-Path $src)) { "::error::source missing: $src"; exit 1 }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          robocopy $src $stage /E /XD components /NFL /NDL /NJH /NJS
          $rc = $LASTEXITCODE
          Write-Host "robocopy exit=$rc"
          if ($rc -ge 8) { "::error::robocopy failed rc=$rc"; exit $rc }
          try {
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $out -Force
          } catch {
            "::error::Compress-Archive failed: $_"
            exit 1
          }
          if (-not (Test-Path $out)) { "::error::zip missing: $out"; exit 1 }
          Write-Host "zip ok: $out"
          "PORTABLE=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # robocopy's *success* codes are 1 (files copied) and 2 (extras
          # present), and pwsh takes the step's exit code from the last native
          # command unless it is overridden — the packaging step therefore
          # reported failure with exit 1 after a perfectly good zip. Exit
          # explicitly so success is success.
          exit 0

      - name: Build installer (Inno Setup)
        working-directory: ${{ env.BUILD_WS }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc (Join-Path $env:BUILD_WS "windows/installer.iss")
          $v = "${{ steps.version.outputs.version }}"
          $src = Join-Path $env:BUILD_WS "build/installer/SPPlayer-Setup-$v.exe"
          if (-not (Test-Path $src)) { throw "installer not found: $src" }
          "SETUP=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Same trap as the portable step: never let a native command's
          # exit code leak into the step's result once the artifact is built.
          exit 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SP Player ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.PORTABLE }}
            ${{ env.SETUP }}

      - name: Remove short workspace stage
        if: always()
        shell: pwsh
        run: |
          $shortPath = Join-Path 'C:\e' (Split-Path -Leaf $env:GITHUB_WORKSPACE)
          if (Test-Path $shortPath) { Remove-Item -Path $shortPath -Recurse -Force }
